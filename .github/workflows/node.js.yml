name: Frontend CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # 3. Deploy FULL source code to server (SAFE VERSION)
      - name: Deploy source to server
        run: |
          rsync -av --delete \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.github \
            $GITHUB_WORKSPACE/ /var/alphadevs/my_web_app/CloudTestFrontend/

      # 4. Install dependencies on server
      - name: Install dependencies
        run: |
          cd /var/alphadevs/my_web_app/CloudTestFrontend
          npm install

      # 5. Build React app on server
      - name: Build app
        run: |
          cd /var/alphadevs/my_web_app/CloudTestFrontend
          CI=false npm run build

      # 6. Restart PM2 process
      - name: Restart app
        run: |
          pm2 restart CloudTestFrontend || pm2 serve /var/alphadevs/my_web_app/CloudTestFrontend/build 3000 --name CloudTestFrontend --spa